---
name: Check Syntax
on: [push, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  syntax-check:
    name: vale
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Download .vale.ini
        run: curl -fsSL -o .vale.ini https://raw.githubusercontent.com/fharper/gh-configs/main/.vale.ini

      - name: Create the folders
        run: |
          mkdir -p styles && mkdir -p styles/Custom && mkdir -p styles/config && mkdir -p styles/config/vocabularies && mkdir -p styles/config/vocabularies/base

      - name: Download Custom Style ignore.txt
        run: curl -fsSL -o styles/Custom/ignore.txt https://raw.githubusercontent.com/fharper/gh-configs/main/styles/Custom/ignore.txt

      - name: Download Custom Style spelling.yml
        run: curl -fsSL -o styles/Custom/spelling.yml https://raw.githubusercontent.com/fharper/gh-configs/main/styles/Custom/spelling.yml

      - name: Download Custom Style substitutions.yml
        run: curl -fsSL -o styles/Custom/substitutions.yml https://raw.githubusercontent.com/fharper/gh-configs/main/styles/Custom/substitutions.yml

      - name: Download base Vocab accept.txt
        run: curl -fsSL -o styles/config/vocabularies/base/accept.txt https://raw.githubusercontent.com/fharper/gh-configs/main/styles/config/vocabularies/base/accept.txt

      - name: Validate the syntax
        uses: errata-ai/vale-action@v3.0.0
        with:
          version: 3.24.0
          glob: '**/*.md'
          sync: false
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: true
