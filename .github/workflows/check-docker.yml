---
name: Check Dockerfile
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Check for a Dockerfile
        id: check
        run: |
          if [ -n "$(git ls-files Dockerfile)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Dockerfile found. Delete .github/workflows/check-docker.yml if this project doesn't need it."
            exit 1
          fi

  docker-check:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      # Rules at https://github.com/hadolint/hadolint#rules
      # The hadolint image is pinned in .tools/hadolint/Dockerfile, so Dependabot can update it
      - name: Validate Dockerfile
        run: |
          image="$(sed -n 's/^FROM //p' .tools/hadolint/Dockerfile)"
          docker run --rm -i "$image" hadolint - < Dockerfile
