---
name: Check Dockerfile
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  docker-check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Check for a Dockerfile
        run: |
          if [ -z "$(git ls-files Dockerfile)" ]; then
            echo "::error::No Dockerfile found. Delete .github/workflows/check-docker.yml if this project doesn't need it."
            exit 1
          fi

      # Rules at https://github.com/hadolint/hadolint#rules
      # hadolint/hadolint-action is causing issue with act: https://github.com/hadolint/hadolint/issues/823
      - name: Validate Dockerfile
        run: docker run -v "$(pwd)":"/files" hadolint/hadolint:v2.15.1 hadolint /files/Dockerfile
