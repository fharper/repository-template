---
name: Check CSS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Check for CSS files
        id: check
        run: |
          if [ -n "$(git ls-files '*.css')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No CSS files found. Delete .github/workflows/check-css.yml if this project doesn't need it."
            exit 1
          fi

  csslint:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the code
        uses: actions/checkout@v6.0.1

      - name: Download .stylelintrc
        run: curl -fsSL -o .stylelintrc https://raw.githubusercontent.com/fharper/gh-configs/main/.stylelintrc

      - name: stylelint
        uses: actions-hub/stylelint@v1.1.6
        env:
          PATTERN: "**/*.css"
