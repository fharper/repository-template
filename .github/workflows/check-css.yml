---
name: Check CSS
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  csslint:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the code
        uses: actions/checkout@v6.0.1

      - name: Download .stylelintrc
        run: curl -fsSL -o .stylelintrc https://raw.githubusercontent.com/fharper/gh-configs/main/.stylelintrc

      - name: stylelint
        uses: actions-hub/stylelint@v1.1.6
        env:
          PATTERN: "**/*.css"
