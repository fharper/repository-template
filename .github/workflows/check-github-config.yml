---
name: Check GitHub Config
on:
  push:
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-config-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/tools/check-jsonschema/requirements.txt

      - name: Install check-jsonschema
        run: pip install -r .github/tools/check-jsonschema/requirements.txt

      - name: Validate Dependabot configuration
        if: hashFiles('.github/dependabot.yml') != ''
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Validate issue forms
        if: hashFiles('.github/ISSUE_TEMPLATE/*.yml') != ''
        run: |
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name 'config.yml' -print0 |
            xargs -0 check-jsonschema --builtin-schema vendor.github-issue-forms

      - name: Validate issue template configuration
        if: hashFiles('.github/ISSUE_TEMPLATE/config.yml') != ''
        run: check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
