---
name: Check GitHub Actions
on:
  push:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
      - '.tools/actionlint/**'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
      - '.tools/actionlint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-actions-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .tools/actionlint/go.mod
          cache-dependency-path: .tools/actionlint/go.sum

      - name: Build actionlint
        run: go -C .tools/actionlint build -o "$RUNNER_TEMP/actionlint" github.com/rhysd/actionlint/cmd/actionlint

      # Print each problem as a GitHub annotation on the file and line
      - name: Check Workflow files
        env:
          FORMAT: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -format "$FORMAT"'
