---
name: Check JSON
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  json-check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Check for JSON files
        run: |
          if [ -z "$(git ls-files '*.json')" ]; then
            echo "::error::No JSON files found. Delete .github/workflows/check-json.yml if this project doesn't need it."
            exit 1
          fi

      - name: Validate JSON syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! error=$(jq empty "$file" 2>&1); then
              echo "::error file=$file::$error"
              status=1
            fi
          done < <(git ls-files -z '*.json')
          exit $status
