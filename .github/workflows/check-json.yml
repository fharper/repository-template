---
name: Check JSON
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Check for JSON files
        id: check
        run: |
          if [ -n "$(git ls-files '*.json')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No JSON files found. Delete .github/workflows/check-json.yml if this project doesn't need it."
            exit 1
          fi

  json-check:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Validate JSON syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! error=$(jq empty "$file" 2>&1); then
              echo "::error file=$file::$error"
              status=1
            fi
          done < <(git ls-files -z '*.json')
          exit $status
