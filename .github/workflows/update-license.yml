---
name: Update License Year

on:
  schedule:
    - cron: '0 4 1 1 *'  # January 1st at 04:00 UTC, which is 11 PM Eastern on December 31st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-license-year:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1

      - uses: FantasticFiasco/action-update-license-year@v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # if needed them to be signed
          # commitAuthorName: 'Fred'
          # commitAuthorEmail: ${{ secrets.GPG_EMAIL }}
          # gpgPrivateKey: ${{ secrets.GPG_KEY }}
          # gpgPassphrase: ${{ secrets.GPG_PASSPHRASE }}
          # if using commit prefixes
          # commitTitle: "chore: update license years for {{currentYear}}"
          # prTitle: "chore: update license years for {{currentYear}}"
