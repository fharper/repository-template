---
name: Check Node.js
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Check for a Node.js project
        id: check
        run: |
          if [ -n "$(git ls-files package.json)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No package.json found. Delete .github/workflows/check-nodejs.yml if this project doesn't need it."
            exit 1
          fi

  nodejs-check:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: v26.13.0
          cache: npm

      - name: Install ESLint and neostandard
        run: npm install --no-save eslint@10.12.0 neostandard@0.14.1 eslint-formatter-pretty@7.1.0

      - name: Download eslint.config.mjs
        run: curl -fsSL -o eslint.config.mjs https://raw.githubusercontent.com/fharper/gh-configs/main/eslint.config.mjs

      # Rules https://eslint.org/docs/latest/rules/ and https://eslint.style/rules
      - name: Run ESLint
        run: npx eslint . --format=pretty
