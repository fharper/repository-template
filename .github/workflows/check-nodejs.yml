---
name: Check Node.js
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  nodejs-check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: v26.13.0
          cache: npm

      - name: Install ESLint and neostandard
        run: npm install --no-save eslint@10.12.0 neostandard@0.14.1 eslint-formatter-pretty@7.1.0

      - name: Download eslint.config.mjs
        run: curl -fsSL -o eslint.config.mjs https://raw.githubusercontent.com/fharper/gh-configs/main/eslint.config.mjs

      # Rules https://eslint.org/docs/latest/rules/ and https://eslint.style/rules
      - name: Run ESLint
        run: npx eslint . --format=pretty
