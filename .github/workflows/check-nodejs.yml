---
name: Check Node.js
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Check for a Node.js project
        id: check
        run: |
          if [ -n "$(git ls-files package.json)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No package.json found. Delete .github/workflows/check-nodejs.yml if this project doesn't need it."
            exit 1
          fi

  nodejs-check:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: v26.13.0
          cache: npm
          cache-dependency-path: .github/tools/eslint/package-lock.json

      - name: Install ESLint and neostandard
        run: npm ci --prefix .github/tools/eslint

      - name: Download eslint.config.mjs
        run: curl -fsSL -o .github/tools/eslint/eslint.config.mjs https://raw.githubusercontent.com/fharper/gh-configs/main/eslint.config.mjs

      # Rules https://eslint.org/docs/latest/rules/ and https://eslint.style/rules
      - name: Run ESLint
        run: .github/tools/eslint/node_modules/.bin/eslint --config .github/tools/eslint/eslint.config.mjs . --format ./.github/tools/eslint/node_modules/eslint-formatter-pretty/index.js
