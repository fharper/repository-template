---
name: YAML Validation
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  yaml-check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Download .yamllint.yml
        uses: suisei-cn/actions-download-file@v1.6.1
        with:
          url: "https://raw.githubusercontent.com/fharper/gh-configs/main/.yamllint.yml"

      - name: Lint YAML files
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_config_datapath: .yamllint.yml
          yamllint_strict: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
