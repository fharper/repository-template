---
name: Check YAML
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Download .yamllint.yml
        run: curl -fsSL -o .yamllint.yml https://raw.githubusercontent.com/fharper/gh-configs/main/.yamllint.yml

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .tools/yamllint/requirements.txt

      - name: Install yamllint
        run: pip install -r .tools/yamllint/requirements.txt

      - name: Lint YAML files
        run: yamllint --strict --format github --config-file .yamllint.yml .
