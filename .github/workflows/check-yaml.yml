---
name: Check YAML
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Download .yamllint.yml
        run: curl -fsSL -o .yamllint.yml https://raw.githubusercontent.com/fharper/gh-configs/main/.yamllint.yml

      - name: Lint YAML files
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_config_datapath: .yamllint.yml
          yamllint_strict: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
