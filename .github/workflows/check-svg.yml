---
name: Check SVG
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Check for SVG files
        id: check
        run: |
          if [ -n "$(git ls-files '*.svg')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No SVG files found. Delete .github/workflows/check-svg.yml if this project doesn't need it."
            exit 1
          fi

  check-svg:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: "Validate SVG files"
        uses: "szepeviktor/svg-validator@v1.0.0"
        with:
          svg_path: "**/*.svg"
