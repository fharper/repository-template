---
name: Check SVG
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  check-svg:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: "Validate SVG files"
        uses: "szepeviktor/svg-validator@v1.0.0"
        with:
          svg_path: "**/*.svg"
