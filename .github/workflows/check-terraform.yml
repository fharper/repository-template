---
name: Check Terraform
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Check for Terraform files
        id: check
        run: |
          if [ -n "$(git ls-files '*.tf')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "fharper/repository-template" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Terraform files found. Delete .github/workflows/check-terraform.yml if this project doesn't need it."
            exit 1
          fi

  tflint:
    needs: files
    if: needs.files.outputs.found == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Download .tflint.hcl
        run: curl -fsSL -o .tflint.hcl https://raw.githubusercontent.com/fharper/gh-configs/main/.tflint.hcl

      - uses: actions/cache@v6.1.0
        name: Cache plugins directory
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.65.0

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint -f compact
