---
name: Check Markdown
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Download .markdownlint.json
        run: curl -fsSL -o .markdownlint.json https://raw.githubusercontent.com/fharper/gh-configs/main/.markdownlint.json

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          command: config
          globs: |
            .markdownlint.json
            **/*.md
            #**/node_modules
