---
name: Check Markdown
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Download .markdownlint.json
        run: curl -fsSL -o .markdownlint.json https://raw.githubusercontent.com/fharper/gh-configs/main/.markdownlint.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tools/.tool-versions
          cache: npm
          cache-dependency-path: .tools/markdownlint/package-lock.json

      - name: Install markdownlint
        run: npm ci --prefix .tools/markdownlint

      - name: Validate Markdown
        run: .tools/markdownlint/node_modules/.bin/markdownlint-cli2 --config .tools/markdownlint/.markdownlint-cli2.jsonc "**/*.md" "#.tools" "#**/node_modules"
