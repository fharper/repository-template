---
name: Check Commit Messages
on: push

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Download .commitlintrc.mjs
        uses: suisei-cn/actions-download-file@v1.6.1
        with:
          url: "https://raw.githubusercontent.com/fharper/gh-configs/main/.commitlintrc.mjs"

      - name: Lint the commits
        uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: .commitlintrc.mjs
          failOnWarnings: true
