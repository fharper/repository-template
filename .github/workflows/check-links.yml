---
name: Check Links
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  markdown-link-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Download .linkspector.yml
        run: curl -fsSL -o .linkspector.yml https://raw.githubusercontent.com/fharper/gh-configs/main/.linkspector.yml

      - name: Validate Links
        uses: UmbrellaDocs/action-linkspector@v1.5.5
        with:
          config_file: .linkspector.yml
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
