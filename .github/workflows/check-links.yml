---
name: Check Links
on: [push, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout this repository
        uses: actions/checkout@v6.0.1

      - name: Download .linkspector.yml
        run: curl -fsSL -o .linkspector.yml https://raw.githubusercontent.com/fharper/gh-configs/main/.linkspector.yml

      - name: Validate Links
        uses: UmbrellaDocs/action-linkspector@v1.5.5
        with:
          config_file: .linkspector.yml
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
