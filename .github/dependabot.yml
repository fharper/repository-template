---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /.tools/*
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.tools/hadolint
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /.tools/actionlint
      - /.tools/vale
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /.tools/check-jsonschema
      - /.tools/yamllint
    schedule:
      interval: weekly
