---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /.tools/*
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /.tools/actionlint
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /.tools/check-jsonschema
      - /.tools/yamllint
    schedule:
      interval: weekly
